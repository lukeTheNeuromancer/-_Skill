<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>Three.js 入门成果 · 你的第一个 3D 世界</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: rgba(18, 22, 32, 0.72);
    --accent: #59e6a8;
    --accent-2: #6ea8ff;
    --text: #eaeef5;
    --muted: #8892a6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  canvas { display: block; }

  #hud {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 16px 20px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    max-width: 300px;
    pointer-events: none;
  }
  #hud h1 {
    font-size: 15px;
    margin: 0 0 6px;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
  }
  #hud p {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--muted);
  }
  #hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 18px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--muted);
    display: flex;
    gap: 14px;
    white-space: nowrap;
  }
  #hint b { color: var(--text); font-weight: 600; }
  #counter {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 10px 16px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    font-size: 12.5px;
    color: var(--muted);
  }
  #counter b { color: var(--accent); font-size: 16px; }
</style>
</head>
<body>

<div id="hud">
  <h1>🟩 你的第一个 3D 世界</h1>
  <p>这是教程最终效果的可运行版本 —— 拖动旋转视角，点击立方体换个心情。</p>
</div>

<div id="counter">已点击 <b id="clickCount">0</b> 次</div>

<div id="hint">
  <span>🖱️ <b>左键拖动</b> 旋转</span>
  <span>🔍 <b>滚轮</b> 缩放</span>
  <span>👆 <b>点击立方体</b> 换色</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- Scene / Camera / Renderer ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.Fog(0x0b0e14, 8, 20);

const camera = new THREE.PerspectiveCamera(
  60, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(3, 2.2, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ---- Controls ----
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2.5;
controls.maxDistance = 12;

// ---- Lighting ----
const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
dirLight.position.set(5, 6, 5);
scene.add(dirLight);

const ambient = new THREE.AmbientLight(0x6ea8ff, 0.35);
scene.add(ambient);

const rim = new THREE.PointLight(0x59e6a8, 6, 15);
rim.position.set(-4, 2, -3);
scene.add(rim);

// ---- Ground grid (small "world" feel) ----
const grid = new THREE.GridHelper(20, 20, 0x334155, 0x1a2130);
grid.position.y = -1.3;
scene.add(grid);

// ---- The cube (with rounded feel via bevel-ish scaling on edges) ----
const geometry = new THREE.BoxGeometry(1.4, 1.4, 1.4);
const palette = [0x59e6a8, 0x6ea8ff, 0xffb454, 0xff6e97, 0xc792ea];
let colorIndex = 0;

const material = new THREE.MeshStandardMaterial({
  color: palette[colorIndex],
  roughness: 0.35,
  metalness: 0.15,
});
const cube = new THREE.Mesh(geometry, material);
cube.castShadow = false;
scene.add(cube);

// subtle wireframe overlay for a "tech" look
const wireGeo = new THREE.BoxGeometry(1.42, 1.42, 1.42);
const wireMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.06 });
cube.add(new THREE.Mesh(wireGeo, wireMat));

// ---- Click to change color (bonus interaction) ----
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let clicks = 0;
const clickCountEl = document.getElementById('clickCount');

renderer.domElement.addEventListener('click', (event) => {
  pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(cube);
  if (hits.length > 0) {
    colorIndex = (colorIndex + 1) % palette.length;
    material.color.setHex(palette[colorIndex]);
    clicks++;
    clickCountEl.textContent = clicks;
    cube.scale.setScalar(1);
    // tiny pop animation
    const start = performance.now();
    const pop = () => {
      const t = (performance.now() - start) / 180;
      if (t < 1) {
        const s = 1 + Math.sin(t * Math.PI) * 0.15;
        cube.scale.setScalar(s);
        requestAnimationFrame(pop);
      } else {
        cube.scale.setScalar(1);
      }
    };
    pop();
  }
});

// ---- Resize handling ----
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- Animation loop ----
function animate() {
  requestAnimationFrame(animate);
  cube.rotation.x += 0.006;
  cube.rotation.y += 0.009;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
